# HTTP — proxy same-origin: /api|admin|2fa|_nested_admin|media -> Django,
# tudo mais -> Next.js. Ver plano de migração (fase 1) para o racional de
# manter sessão/cookie em vez de JWT: os dois apps vivem sob a mesma origem.
server {
    listen 80;
    server_name aquila.cenipa.intraer www.aquila.cenipa.intraer localhost;

    client_max_body_size 300M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Location interna: só o X-Accel-Redirect do Django (dedalo/media_views.py)
    # consegue disparar essa entrega; acesso direto de fora dá 404.
    location /protected-media/ {
        internal;
        alias /app/media/;
    }

    # /media/<path> não é mais servido diretamente pelo nginx — cai no
    # Django, que autentica antes de devolver X-Accel-Redirect.
    location ~ ^/(api|admin|2fa|_nested_admin|media)/ {
        resolver           127.0.0.11 valid=10s;
        set $upstream      http://web:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        resolver           127.0.0.11 valid=10s;
        set $upstream      http://frontend:3000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
